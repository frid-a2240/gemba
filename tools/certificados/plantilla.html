<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Certificado {{folio}}</title>
<style>
  @font-face { font-family: 'Cinzel'; font-weight: 600; src: url('{{fontCinzel}}') format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 100 900; src: url('{{fontMontserrat}}') format('woff2'); }

  /* Carta horizontal: 11 × 8.5 in */
  @page { size: 11in 8.5in; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 11in; height: 8.5in; }
  body {
    font-family: 'Montserrat', sans-serif;
    color: #0B1F3A;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .cert {
    position: relative;
    width: 11in;
    height: 8.5in;
    overflow: hidden;
    background: #FFFFFF;
  }

  /* Marco: banda azul marino + filete plateado */
  .frame {
    position: absolute;
    inset: 0.28in;
    border: 3px solid #0B1F3A;
  }
  .frame::after {
    content: "";
    position: absolute;
    inset: 7px;
    border: 1px solid #A7A9AC;
  }

  /* Esquinas diagonales */
  .corner { position: absolute; z-index: 1; width: 2.6in; height: 2.6in; }
  .corner-tl { top: 0; left: 0; background: linear-gradient(135deg, #0B1F3A 0 34%, transparent 34%); }
  .corner-tl::after { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, transparent 0 36%, #A7A9AC 36% 37%, transparent 37%); }
  .corner-br { right: 0; bottom: 0; background: linear-gradient(315deg, #0B1F3A 0 34%, transparent 34%); }
  .corner-br::after { content: ""; position: absolute; inset: 0; background: linear-gradient(315deg, transparent 0 36%, #A7A9AC 36% 37%, transparent 37%); }

  /* Marca de agua */
  .watermark {
    position: absolute;
    right: 0.9in;
    top: 50%;
    width: 4.2in;
    transform: translateY(-50%);
    opacity: 0.045;
  }

  .content {
    position: absolute;
    z-index: 2;
    inset: 0.55in 0.9in 0.5in;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .logo { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .logo .g { height: 0.78in; }
  .logo .wm { height: 0.42in; }

  /* El cuerpo se centra en el espacio entre el logo y las firmas */
  .body { margin: auto 0; display: flex; flex-direction: column; align-items: center; }
  .title {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 40px;
    letter-spacing: 0.22em;
    padding-left: 0.22em;
  }
  .granted {
    margin-top: 0.14in;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #6B6D70;
  }
  .name {
    margin-top: 0.16in;
    padding: 0 0.4in 0.1in;
    min-width: 6.4in;
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 34px;
    letter-spacing: 0.04em;
    border-bottom: 1.5px solid #A7A9AC;
  }
  .reason { margin-top: 0.18in; font-size: 13px; color: #3F4A5A; }
  .program {
    margin-top: 0.08in;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .details { margin-top: 0.08in; font-size: 12.5px; color: #3F4A5A; }

  .footer {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    align-items: end;
  }
  .sign { text-align: center; }
  .sign .line { width: 2.6in; margin: 0 auto 8px; border-top: 1.2px solid #0B1F3A; }
  .sign strong { display: block; font-size: 13px; }
  .sign span { font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: #6B6D70; }

  .motto {
    align-self: center;
    font-family: 'Cinzel', serif;
    font-size: 9.5px;
    letter-spacing: 0.1em;
    white-space: nowrap;
    color: #6B6D70;
  }
  .motto .folio {
    display: block;
    margin-top: 10px;
    font-family: 'Montserrat', sans-serif;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: #0B1F3A;
  }

  .verify { display: flex; justify-content: flex-end; }
  .verify .qr { width: 1.12in; height: 1.12in; padding: 5px; background: #FFFFFF; }
  .verify .qr svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <div class="cert">
    <div class="corner corner-tl"></div>
    <div class="corner corner-br"></div>
    <div class="frame"></div>
    <img class="watermark" src="{{logoG}}" alt="" />

    <div class="content">
      <div class="logo">
        <img class="g" src="{{logoG}}" alt="" />
        <img class="wm" src="{{logoWordmark}}" alt="GENBA Institution" />
      </div>

      <div class="body">
        <h1 class="title">CERTIFICADO</h1>
        <p class="granted">Se otorga el presente a</p>
        <p class="name">{{nombre}}</p>
        <p class="reason">por haber acreditado satisfactoriamente el programa</p>
        <p class="program">{{programa}}</p>
        <p class="details">con una duración de {{horas}} horas · {{ciudad}} · {{fecha}}</p>
      </div>

      <div class="footer">
        <div class="sign">
          <div class="line"></div>
          <strong>{{firmaNombre}}</strong>
          <span>{{firmaCargo}}</span>
        </div>
        <div class="motto">Excelencia Operacional. Integridad. Desarrollo.<span class="folio">Folio: {{folio}}</span></div>
        <div class="verify">
          <div class="qr">{{qr}}</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
