<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" role="img" aria-label="GENBA Instituto">
  <!-- Triángulo/A del isotipo: dos trazos oscuros + dos trazos azules formando la montaña -->
  <g stroke-linecap="round" stroke-width="6" fill="none">
    <!-- Lado izquierdo (navy) -->
    <line x1="18"  y1="78" x2="52" y2="12" stroke="#0F172A"/>
    <line x1="30"  y1="78" x2="60" y2="20" stroke="#0F172A"/>
    <!-- Lado derecho (azul eléctrico) -->
    <line x1="52"  y1="12" x2="86" y2="78" stroke="#2563EB"/>
    <line x1="60"  y1="20" x2="90" y2="78" stroke="#2563EB"/>
  </g>

  <!-- Wordmark GENBA -->
  <text x="108" y="55"
        font-family="'Space Grotesk', 'Inter', system-ui, sans-serif"
        font-weight="700"
        font-size="42"
        letter-spacing="1"
        fill="#0F172A">GENBA</text>

  <!-- Bajada INSTITUTO con tracking amplio -->
  <text x="109" y="75"
        font-family="'Inter', system-ui, sans-serif"
        font-weight="500"
        font-size="10"
        letter-spacing="6"
        fill="#475569">INSTITUTO</text>
</svg>